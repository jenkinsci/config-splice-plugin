# Localisable strings for Config Splice.
#
# The Jenkins localizer generates io.jenkins.plugins.configsplice.Messages from this file at build
# time, so every key below becomes a static method. Keep keys grouped by the class that uses them.

ConfigSubstitutionStep.DisplayName=Substitute values in JSON and .NET XML configuration files
ConfigSubstitutionBuilder.DisplayName=Substitute values in JSON and .NET XML configuration files
TargetGroup.DisplayName=Target group
Substitution.DisplayName=Substitution

# Validation
Substitution.PathRequired=A property path is required.
Substitution.BothSources=Set either a literal value or a credential, not both.
Substitution.CredentialNotFound=Cannot find this Secret Text credential in the current context.

# Value type (SRS 7.2 to 7.4)
Substitution.Type.auto=Automatic - match the existing value''s type
Substitution.Type.string=String
Substitution.Type.number=Number
Substitution.Type.boolean=Boolean
Substitution.Type.null=Null (writes JSON null; no value)

# Target group format (SRS 5.2)
TargetGroup.Format.auto=Detect from file extension and content
TargetGroup.Format.json=JSON
TargetGroup.Format.xml=XML (.NET configuration)

# Error policies (SRS 9.1)
Behavior.fail=Fail the build
Behavior.warn=Warn and continue
Behavior.ignore=Ignore silently
